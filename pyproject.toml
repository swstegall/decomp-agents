[project]
name = "decomp-agents"
version = "0.1.0"
description = "Parallel autonomous Claude agents that drive meteor-decomp's per-function matching workflow."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Samuel Stegall" }]

dependencies = [
  "claude-agent-sdk>=0.0.20",
  "anyio>=4.0",
  "pyyaml>=6.0",
  "tomli>=2.0",
  "rich>=13.0",
  "click>=8.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-anyio>=0.0", "ruff>=0.5"]

[project.scripts]
decomp-agents = "decomp_agents.orchestrator:main"
decomp-worker = "decomp_agents.worker:main"
decomp-agents-retry-escalated = "decomp_agents.retry_escalated:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/decomp_agents"]

[tool.pytest.ini_options]
# src-layout: add `src/` to sys.path so `import decomp_agents` works under
# a bare `python3 -m pytest` without an editable install (`pip install -e .`).
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
